name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Ручной запуск

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ==================== JOB 1: ТЕСТИРОВАНИЕ ФРОНТЕНДА ====================
  test-frontend:
    name: Test Frontend (Next.js)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run linting
        working-directory: ./frontend
        run: npm run lint
      
      - name: Run TypeScript type check
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Run tests (if exist)
        working-directory: ./frontend
        run: npm test -- --passWithNoTests
      
      - name: Build application
        working-directory: ./frontend
        run: npm run build

  # ==================== JOB 2: ТЕСТИРОВАНИЕ БЭКЕНДА ====================
  test-backend:
    name: Test Backend (FastAPI)
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      
      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
      
      - name: Run security scan (Bandit)
        working-directory: ./backend
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json || true
      
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: ./backend/bandit-report.json

  # ==================== JOB 3: ДЕПЛОЙ ФРОНТЕНДА НА VERCEL ====================
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      
      - name: Deploy to Vercel (Production)
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
      
      - name: Notify deployment success
        run: |
          echo "✅ Frontend deployed to Vercel successfully!"

  # ==================== JOB 4: СБОРКА И ПУБЛИКАЦИЯ DOCKER ОБРАЗА ====================
  build-and-push-backend:
    name: Build and Push Backend Docker Image
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Yandex Cloud Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_KEY_JSON }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/book-api
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Output image tags
        run: |
          echo "Images pushed: ${{ steps.meta.outputs.tags }}"
          echo "📦 Backend image published to Yandex Container Registry"

  # ==================== JOB 5: ДЕПЛОЙ БЭКЕНДА В CLOUD RUN ====================
  deploy-backend:
    name: Deploy Backend to Yandex Cloud Run
    runs-on: ubuntu-latest
    needs: [build-and-push-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH
      
      - name: Authenticate to Yandex Cloud
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
        run: |
          echo "$YC_SA_KEY_JSON" > key.json
          yc config set service-account-key key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          yc config set format json
      
      - name: Deploy container to Cloud Run
        run: |
          # Вытаскиваем ID сервисного аккаунта из файла ключа с помощью jq
          SA_ID=$(jq -r .service_account_id key.json)
          
          yc serverless container revision deploy \
            --container-name ${{ secrets.YC_CONTAINER_NAME }} \
            --image cr.yandex/${{ secrets.YC_REGISTRY_ID }}/book-api:latest \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 30s \
            --concurrency 10 \
            --service-account-id $SA_ID \
            --environment DATABASE_URL="${{ secrets.DB_URL }}"
      
      - name: Get container URL
        run: |
          # Получаем информацию и выводим её для отладки
          INFO=$(yc serverless container get ${{ secrets.YC_CONTAINER_NAME }} --format json)
          echo $INFO | jq '.'
          
          # Пытаемся достать URL из разных возможных мест
          # Обычно это .url или .status.url
          URL=$(echo $INFO | jq -r '.url // .status.url // "URL_NOT_FOUND"')
          
          echo "Container URL: $URL"
          echo "CONTAINER_URL=$URL" >> $GITHUB_ENV
      
      - name: Health check
        run: |
          CONTAINER_URL=$(yc serverless container get ${{ secrets.YC_CONTAINER_NAME }} --format json | jq -r '.status.url')
          curl -f $CONTAINER_URL/health || exit 1

  # ==================== JOB 6: УВЕДОМЛЕНИЕ О СТАТУСЕ ====================
  notify:
    name: Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Check status
        id: status
        run: |
          if [ "${{ needs.deploy-frontend.result }}" == "success" ] && [ "${{ needs.deploy-backend.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "message=✅ All services deployed successfully!" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "message=❌ Deployment failed. Check GitHub Actions logs." >> $GITHUB_OUTPUT
          fi
      
      # - name: Send Telegram notification (optional)
      #   if: success() && secrets.TELEGRAM_BOT_TOKEN != ''
      #   uses: appleboy/telegram-action@master
      #   with:
      #     to: ${{ secrets.TELEGRAM_CHAT_ID }}
      #     token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      #     message: |
      #       🚀 Deployment Status
            
      #       Repository: ${{ github.repository }}
      #       Branch: ${{ github.ref_name }}
      #       Commit: ${{ github.sha }}
      #       Author: ${{ github.actor }}
            
      #       ${{ steps.status.outputs.message }}
            
      #       See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}